<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="940" height="640" fill="#ffffff"/>

  <!-- ===== Raspberry Pi box ===== -->
  <rect x="40" y="40" width="220" height="560" rx="10" fill="#f7f7f8" stroke="#333333" stroke-width="2"/>
  <text x="150" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Raspberry Pi 3A+</text>
  <text x="150" y="90" text-anchor="middle" font-size="12" fill="#555555">40-pin header (relevant pins)</text>

  <!-- Pi pins: label + tick at right edge (x=260) -->
  <!-- 3.3V -->
  <line x1="200" y1="120" x2="260" y2="120" stroke="#c0392b" stroke-width="3"/>
  <text x="190" y="124" text-anchor="end" font-size="13" fill="#1a1a1a">3.3V (pin 1)</text>
  <!-- GND -->
  <line x1="200" y1="160" x2="260" y2="160" stroke="#555555" stroke-width="3"/>
  <text x="190" y="164" text-anchor="end" font-size="13" fill="#1a1a1a">GND (pin 6)</text>
  <!-- SDA -->
  <line x1="200" y1="210" x2="260" y2="210" stroke="#2563eb" stroke-width="3"/>
  <text x="190" y="214" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO2 / SDA (pin 3)</text>
  <!-- SCL -->
  <line x1="200" y1="250" x2="260" y2="250" stroke="#2563eb" stroke-width="3"/>
  <text x="190" y="254" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO3 / SCL (pin 5)</text>
  <!-- SPI1 SCLK -->
  <line x1="200" y1="300" x2="260" y2="300" stroke="#16a34a" stroke-width="3"/>
  <text x="190" y="304" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO21 / SCLK (pin 40)</text>
  <!-- SPI1 MOSI -->
  <line x1="200" y1="340" x2="260" y2="340" stroke="#16a34a" stroke-width="3"/>
  <text x="190" y="344" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO20 / MOSI (pin 38)</text>
  <!-- CS -->
  <line x1="200" y1="390" x2="260" y2="390" stroke="#16a34a" stroke-width="3"/>
  <text x="190" y="394" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO5 / CS (pin 29)</text>
  <!-- DC -->
  <line x1="200" y1="430" x2="260" y2="430" stroke="#16a34a" stroke-width="3"/>
  <text x="190" y="434" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO6 / DC (pin 31)</text>
  <!-- RST -->
  <line x1="200" y1="470" x2="260" y2="470" stroke="#16a34a" stroke-width="3"/>
  <text x="190" y="474" text-anchor="end" font-size="13" fill="#1a1a1a">GPIO13 / RST (pin 33)</text>

  <!-- Audio jack icon -->
  <circle cx="150" cy="540" r="14" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="150" cy="540" r="4" fill="#f59e0b"/>
  <text x="150" y="570" text-anchor="middle" font-size="13" fill="#1a1a1a">3.5mm audio out</text>
  <line x1="164" y1="540" x2="260" y2="540" stroke="#f59e0b" stroke-width="3"/>

  <!-- ===== Rotary encoder box ===== -->
  <rect x="600" y="70" width="300" height="200" rx="10" fill="#f7f7f8" stroke="#333333" stroke-width="2"/>
  <text x="750" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Adafruit I2C QT Rotary Encoder</text>
  <text x="750" y="116" text-anchor="middle" font-size="12" fill="#555555">seesaw, address 0x36, built-in pushbutton</text>

  <line x1="600" y1="150" x2="660" y2="150" stroke="#c0392b" stroke-width="3"/>
  <text x="670" y="154" font-size="13" fill="#1a1a1a">VIN</text>
  <line x1="600" y1="180" x2="660" y2="180" stroke="#555555" stroke-width="3"/>
  <text x="670" y="184" font-size="13" fill="#1a1a1a">GND</text>
  <line x1="600" y1="210" x2="660" y2="210" stroke="#2563eb" stroke-width="3"/>
  <text x="670" y="214" font-size="13" fill="#1a1a1a">SDA</text>
  <line x1="600" y1="240" x2="660" y2="240" stroke="#2563eb" stroke-width="3"/>
  <text x="670" y="244" font-size="13" fill="#1a1a1a">SCL</text>

  <!-- ===== OLED box ===== -->
  <rect x="600" y="310" width="300" height="240" rx="10" fill="#f7f7f8" stroke="#333333" stroke-width="2"/>
  <text x="750" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">SSD1306 OLED, 128x32</text>
  <text x="750" y="356" text-anchor="middle" font-size="12" fill="#555555">SPI1 bus, software chip-select</text>

  <line x1="600" y1="390" x2="660" y2="390" stroke="#c0392b" stroke-width="3"/>
  <text x="670" y="394" font-size="13" fill="#1a1a1a">VIN</text>
  <line x1="600" y1="415" x2="660" y2="415" stroke="#555555" stroke-width="3"/>
  <text x="670" y="419" font-size="13" fill="#1a1a1a">GND</text>
  <line x1="600" y1="440" x2="660" y2="440" stroke="#16a34a" stroke-width="3"/>
  <text x="670" y="444" font-size="13" fill="#1a1a1a">SCK</text>
  <line x1="600" y1="465" x2="660" y2="465" stroke="#16a34a" stroke-width="3"/>
  <text x="670" y="469" font-size="13" fill="#1a1a1a">MOSI / DIN</text>
  <line x1="600" y1="490" x2="660" y2="490" stroke="#16a34a" stroke-width="3"/>
  <text x="670" y="494" font-size="13" fill="#1a1a1a">CS</text>
  <line x1="600" y1="515" x2="660" y2="515" stroke="#16a34a" stroke-width="3"/>
  <text x="670" y="519" font-size="13" fill="#1a1a1a">DC</text>
  <line x1="600" y1="530" x2="660" y2="530" stroke="#16a34a" stroke-width="3"/>
  <text x="670" y="534" font-size="13" fill="#1a1a1a">RST</text>

  <!-- Diagonal wires: Pi -> Encoder (fan out for shared power/gnd) -->
  <line x1="260" y1="120" x2="600" y2="150" stroke="#c0392b" stroke-width="2"/>
  <line x1="260" y1="160" x2="600" y2="180" stroke="#555555" stroke-width="2"/>
  <line x1="260" y1="210" x2="600" y2="210" stroke="#2563eb" stroke-width="2"/>
  <line x1="260" y1="250" x2="600" y2="240" stroke="#2563eb" stroke-width="2"/>

  <!-- Diagonal wires: Pi -> OLED (power/gnd fan out + SPI) -->
  <line x1="260" y1="120" x2="600" y2="390" stroke="#c0392b" stroke-width="2" stroke-dasharray="1 0"/>
  <line x1="260" y1="160" x2="600" y2="415" stroke="#555555" stroke-width="2"/>
  <line x1="260" y1="300" x2="600" y2="440" stroke="#16a34a" stroke-width="2"/>
  <line x1="260" y1="340" x2="600" y2="465" stroke="#16a34a" stroke-width="2"/>
  <line x1="260" y1="390" x2="600" y2="490" stroke="#16a34a" stroke-width="2"/>
  <line x1="260" y1="430" x2="600" y2="515" stroke="#16a34a" stroke-width="2"/>
  <line x1="260" y1="470" x2="600" y2="530" stroke="#16a34a" stroke-width="2"/>

  <!-- ===== Speaker / amp box ===== -->
  <rect x="480" y="580" width="420" height="50" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="690" y="602" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Powered speaker / amplifier</text>
  <text x="690" y="620" text-anchor="middle" font-size="12" fill="#7a4a00">Volume is dialed here — piradio has no volume control</text>
  <line x1="264" y1="540" x2="480" y2="600" stroke="#f59e0b" stroke-width="3"/>

  <!-- ===== Legend ===== -->
  <text x="40" y="20" font-size="12" fill="#555555">Legend:</text>
  <line x1="100" y1="16" x2="130" y2="16" stroke="#c0392b" stroke-width="3"/>
  <text x="135" y="20" font-size="12" fill="#1a1a1a">power</text>
  <line x1="185" y1="16" x2="215" y2="16" stroke="#555555" stroke-width="3"/>
  <text x="220" y="20" font-size="12" fill="#1a1a1a">ground</text>
  <line x1="275" y1="16" x2="305" y2="16" stroke="#2563eb" stroke-width="3"/>
  <text x="310" y="20" font-size="12" fill="#1a1a1a">I2C</text>
  <line x1="350" y1="16" x2="380" y2="16" stroke="#16a34a" stroke-width="3"/>
  <text x="385" y="20" font-size="12" fill="#1a1a1a">SPI1</text>
  <line x1="425" y1="16" x2="455" y2="16" stroke="#f59e0b" stroke-width="3"/>
  <text x="460" y="20" font-size="12" fill="#1a1a1a">analog audio</text>
</svg>
